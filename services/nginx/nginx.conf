worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript application/json;
  client_max_body_size 1m;
  resolver 127.0.0.11 valid=10s ipv6=off;
  limit_req_zone $binary_remote_addr zone=api:5m rate=20r/s;
  log_format json_combined escape=json '{"ts":"$time_iso8601","remote":"$remote_addr","request":"$request","status":$status,"bytes":$body_bytes_sent,"ms":"$request_time","request_id":"$request_id"}';
  access_log /dev/stdout json_combined;
  error_log /dev/stderr warn;

  server {
    listen 80;
    location /healthz { return 200 "ok"; }
    location / { return 308 https://$host:8443$request_uri; }
  }

  server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ssl:2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { access_log off; return 200 "ok"; }
    location = /api/v1/metrics { return 404; }
    location /api/ {
      limit_req zone=api burst=40 nodelay;
      set $backend http://backend:8000;
      proxy_pass $backend;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 30s;
    }
    location / { try_files $uri $uri/ =404; }
  }
}
